name: Android quality gate

on:
  push:
    branches: [main, codex/shizi-v2-child-ux]
  pull_request:
    branches: [main]

jobs:
  audio-tool-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install offline-testable audio tool dependencies
        run: python -m pip install -r tools/audio-generator/requirements.txt
      - name: Python audio generator and media validator tests
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v
      - name: Verify committed audition package
        run: python tools/audio-generator/verify_audition_package.py
      - name: Verify audition reports are stable
        run: python tools/audio-generator/build_audition_report.py --check
      - name: Ensure verification does not modify tracked files
        run: git diff --exit-code
  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: G1 content validation
        run: ./gradlew verifyContentG1 --console=plain
      - name: G2 resource validation
        run: ./gradlew verifyContentG2 --console=plain
      - name: Android lint
        run: ./gradlew lintDebug --console=plain
      - name: Debug APK
        run: ./gradlew assembleDebug --console=plain
